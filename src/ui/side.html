<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: #0e2a5c; color: #cfdcf5; font: 14px/1.4 "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; padding: 14px 10px; user-select: none; overflow: hidden; }
.logo { display: flex; align-items: center; gap: 10px; color: #fff; font-weight: 800; font-size: 16px; padding: 2px 8px 14px; letter-spacing: .3px; }
.logo i { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, #4f9bff, #1a5fd0); display: grid; place-items: center; font-style: normal; }
.sec { font-size: 10.5px; letter-spacing: 1.2px; opacity: .6; padding: 14px 10px 4px; }
.it { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; color: #dbe6fa; }
.it:hover { background: #ffffff14; } .it.on { background: #ffffff26; color: #fff; font-weight: 600; }
.it span.l { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ic { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; font: 700 11px system-ui; color: #fff; flex: 0 0 auto; }
.ic.g { background: #ffffff33; font-size: 13px; }
.bd { background: #d93025; color: #fff; border-radius: 9px; font-size: 11px; padding: 0 6px; line-height: 17px; }
.nw { background: #fbbc04; color: #3a2a00; border-radius: 9px; font-size: 10px; padding: 0 7px; line-height: 17px; font-weight: 700; }
.sp { flex: 1; } .list { overflow-y: auto; }
.empty { opacity: .7; font-size: 12.5px; padding: 6px 10px; }
</style></head><body>
<div class="logo"><i>P</i>PRATIKA</div>
<div class="it" data-k="home"><span class="ic g">⌂</span><span class="l">Home</span></div>
<div class="sec">I TUOI MODULI</div>
<div class="list" id="mods"></div>
<div class="sec">GESTIONE</div>
<div class="it" data-k="store"><span class="ic g">▦</span><span class="l">Store moduli</span><span class="nw">NUOVO</span></div>
<div class="it" data-k="installed"><span class="ic g">⚙</span><span class="l">Moduli installati</span></div>
<div class="sp"></div>
<div class="it" data-k="help"><span class="ic g">?</span><span class="l">Guida e assistenza</span></div>
<script>
const box = document.getElementById('mods');
let route = null;
function mark() { document.querySelectorAll('[data-k]').forEach(e => e.classList.toggle('on', e.dataset.k === route)); }
api.onState(s => {
  route = s.route;
  box.textContent = '';
  if (!s.modules.length) { const d = document.createElement('div'); d.className = 'empty'; d.textContent = 'Nessun modulo attivo. Aprine uno dallo Store.'; box.append(d); }
  s.modules.forEach(m => {
    const d = document.createElement('div'); d.className = 'it' + (m.active ? ' on' : ''); d.title = m.label;
    const ic = document.createElement('span'); ic.className = 'ic'; ic.style.background = m.color; ic.textContent = m.letter;
    const l = document.createElement('span'); l.className = 'l'; l.textContent = m.label;
    d.append(ic, l);
    if (m.badge) { const b = document.createElement('span'); b.className = 'bd'; b.textContent = m.badge; d.append(b); }
    d.onclick = () => api.send('go', 'module', m.id);
    box.append(d);
  });
  mark();
});
document.querySelectorAll('[data-k]').forEach(e => e.onclick = () => api.send('go', e.dataset.k));
api.send('ready');
</script></body></html>
