<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 13px "Segoe UI", system-ui, sans-serif; background: #d3dae5; user-select: none; overflow: hidden; }
#strip { display: flex; height: 40px; align-items: flex-end; padding: 8px 10px 0; gap: 3px; }
.tab { display: flex; align-items: center; gap: 6px; width: 200px; height: 32px; padding: 0 6px 0 14px; background: #bcc6d4; border-radius: 8px 8px 0 0; cursor: default; min-width: 0; }
.tab.active { background: #fff; font-weight: 600; }
.tab span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab button { border: 0; background: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; color: inherit; }
.tab button:hover { background: #0002; }
#plus { border: 0; background: none; font-size: 18px; width: 30px; height: 30px; cursor: pointer; border-radius: 50%; }
#plus:hover { background: #0001; }
#bar { display: flex; height: 44px; align-items: center; gap: 6px; padding: 0 12px; background: #fff; border-bottom: 1px solid #e3e8ef; }
#bar button { border: 0; background: #eef1f6; font-size: 15px; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; color: #5d6b7a; }
#bar button:hover:not(:disabled) { background: #dfe5ee; } #bar button:disabled { opacity: .35; }
#url { flex: 1; height: 32px; border: 0; border-radius: 16px; background: #eef1f6; padding: 0 16px; font: 13px inherit; font-family: inherit; outline: none; color: #1b2430; }
#url:focus { background: #fff; box-shadow: 0 0 0 2px #1a5fd0; }
</style></head><body>
<div id="strip"></div>
<div id="bar">
  <button id="back" title="Indietro">←</button><button id="fwd" title="Avanti">→</button><button id="reload" title="Ricarica">⟳</button>
  <input id="url" placeholder="Cerca o digita un indirizzo" spellcheck="false">
</div>
<script>
const $ = id => document.getElementById(id);
api.onTabs(s => {
  const strip = $('strip');
  strip.textContent = '';
  s.tabs.forEach(t => {
    const d = document.createElement('div');
    d.className = 'tab' + (t.active ? ' active' : '');
    d.title = t.title;
    const sp = document.createElement('span'); sp.textContent = (t.loading ? '⏳ ' : '') + t.title;
    const x = document.createElement('button'); x.textContent = '×';
    x.onclick = e => { e.stopPropagation(); api.send('close-tab', t.id); };
    d.onclick = () => api.send('activate', t.id);
    d.append(sp, x);
    strip.append(d);
  });
  const p = document.createElement('button'); p.id = 'plus'; p.textContent = '+'; p.onclick = () => api.send('new-tab');
  strip.append(p);
  const a = s.tabs.find(t => t.active);
  if (a && document.activeElement !== $('url')) $('url').value = a.url;
  $('back').disabled = !s.canBack; $('fwd').disabled = !s.canFwd;
});
$('back').onclick = () => api.send('back');
$('fwd').onclick = () => api.send('forward');
$('reload').onclick = () => api.send('reload');
$('url').onkeydown = e => { if (e.key === 'Enter') { api.send('navigate', e.target.value); e.target.blur(); } };
api.onFocusUrl(() => { $('url').focus(); $('url').select(); });
api.send('ready');
</script></body></html>
